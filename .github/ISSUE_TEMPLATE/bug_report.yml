name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Flip Watch better! Please fill this in so the bug can be reproduced.
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: e.g. Compress PDF, Typing Test, PDF Reader
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11 / Safari on iPhone 15
