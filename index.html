<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Stopwatch</title>
    <link rel="icon" href="favicon-new.png?v=2" type="image/png">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="dashboard" data-dashboard aria-label="Tools dashboard">
        <div class="dashboard-header">
          <div>
            <p class="dashboard-kicker">Flip Watch</p>
            <h1>Time Tools</h1>
          </div>
          <span class="dashboard-badge">4 Tools</span>
        </div>

        <div class="tool-grid">
          <button class="tool-card primary-tool" type="button" data-open-tool="stopwatch">
            <span class="tool-icon">00</span>
            <span class="tool-name">Stopwatch</span>
            <span class="tool-meta">Count up with flip cards</span>
          </button>

          <button class="tool-card" type="button" data-open-tool="timer">
            <span class="tool-icon">05</span>
            <span class="tool-name">Timer</span>
            <span class="tool-meta">5, 10, 15, 20 min and custom</span>
          </button>

          <button class="tool-card" type="button" data-open-tool="clock">
            <span class="tool-icon">24</span>
            <span class="tool-name">Clock</span>
            <span class="tool-meta">Live local time</span>
          </button>

          <button class="tool-card" type="button" data-open-tool="pdf">
            <span class="tool-icon">PDF</span>
            <span class="tool-name">PDF Reader</span>
            <span class="tool-meta">Books-style reader with search and bookmarks</span>
          </button>
        </div>
      </section>

      <section class="watch-panel" data-tool-panel aria-label="Time tool" hidden>
        <button class="back-button" type="button" data-back-dashboard>Dashboard</button>

        <div class="status-row" aria-live="polite">
          <span class="awake-indicator" data-wake-status="idle">Screen Awake: Off</span>
        </div>

        <div class="mode-row" role="tablist" aria-label="Timer mode">
          <button class="mode-button active" type="button" data-mode="stopwatch">Stopwatch</button>
          <button class="mode-button" type="button" data-mode="timer">Timer</button>
          <button class="mode-button" type="button" data-mode="clock">Clock</button>
        </div>

        <div class="timer-options" data-timer-options hidden>
          <div class="preset-row" aria-label="Timer presets">
            <button class="preset-button active" type="button" data-minutes="5">5 min</button>
            <button class="preset-button" type="button" data-minutes="10">10 min</button>
            <button class="preset-button" type="button" data-minutes="15">15 min</button>
            <button class="preset-button" type="button" data-minutes="20">20 min</button>
          </div>

          <label class="custom-time">
            <span>Custom</span>
            <input type="number" min="1" max="5999" step="1" value="5" data-custom-minutes />
            <span>min</span>
          </label>
        </div>

        <label class="awake-toggle">
          <input type="checkbox" data-awake-toggle checked />
          <span>Screen Awake On Start</span>
        </label>

        <div class="display" aria-live="polite">
          <div class="tick-group">
            <div class="digit-pair" data-unit="hours">
              <div class="flip-card">
                <span class="card-value">0</span>
              </div>
              <div class="flip-card">
                <span class="card-value">0</span>
              </div>
            </div>
            <span class="unit-label">HH</span>
          </div>

          <span class="time-separator">:</span>

          <div class="tick-group">
            <div class="digit-pair" data-unit="minutes">
              <div class="flip-card">
                <span class="card-value">0</span>
              </div>
              <div class="flip-card">
                <span class="card-value">0</span>
              </div>
            </div>
            <span class="unit-label">MM</span>
          </div>

          <span class="time-separator">:</span>

          <div class="tick-group">
            <div class="digit-pair" data-unit="seconds">
              <div class="flip-card">
                <span class="card-value">0</span>
              </div>
              <div class="flip-card">
                <span class="card-value">0</span>
              </div>
            </div>
            <span class="unit-label">SS</span>
          </div>

          <span class="time-separator">:</span>

          <div class="tick-group millis-group">
            <div class="millis-text" data-unit="milliseconds">00</div>
            <span class="unit-label">MS</span>
          </div>
        </div>

        <div class="clock-display" hidden>
          <div class="clock-time">00:00:00</div>
          <div class="clock-date">Tuesday, 23 June 2026</div>
        </div>

        <div class="controls" data-controls>
          <button class="control-button primary" type="button" data-action="start">Start</button>
          <button class="control-button primary" type="button" data-action="stop" hidden>Stop</button>
          <button class="control-button" type="button" data-action="reset">Reset</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
